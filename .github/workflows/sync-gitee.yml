name: Sync GitHub to Gitee

on:
  push:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync GitHub to Gitee
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

        run: |

          # 清除可能存在的 github -> gitee 重写
          git config --global --unset-all url.https://gitee.com/.insteadOf || true

          echo "repo=${{ github.repository }}"
          echo "username=${GITEE_USERNAME}"

          git clone --mirror https://github.com/${{ github.repository }}.git repo.git

          cd repo.git

          git remote add gitee \
          https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/${GITEE_USERNAME}/${{ github.event.repository.name }}.git

          git push gitee --mirror
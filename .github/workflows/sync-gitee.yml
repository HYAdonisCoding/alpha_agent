name: Sync GitHub to Gitee

on:
  push:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync GitHub to Gitee
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

        run: |
          git clone --mirror https://github.com/${{ github.repository }}.git repo.git

          cd repo.git

          git remote add gitee https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/${GITEE_USERNAME}/${{ github.event.repository.name }}.git

          git for-each-ref --format='delete %(refname)' refs/pull | git update-ref --stdin || true

          git push gitee --mirror